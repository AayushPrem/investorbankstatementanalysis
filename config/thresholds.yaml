# Detector, alert and compliance thresholds.
#
# Loaded by config/thresholds.py into frozen dataclasses. Every value here was
# a hardcoded module constant (or inline literal) before Phase 1, and the
# defaults are unchanged. tests/test_thresholds.py pins each one.
#
# Types matter. Values that were Decimal in code are written as QUOTED STRINGS
# and become Decimal, so arithmetic and comparisons stay exact. Floats stay
# floats and ints stay ints. Monetary values are INR.
#
# Changing a value here changes detector behaviour. Bump the matching entry in
# pipeline/versioning.AGENT_VERSIONS when you do.

risk:                                 # analysis/risk.py
  structuring_lower: "150000"         # ₹1.5 lakh
  structuring_upper: "200000"         # ₹2 lakh (§269ST cash limit)
  structuring_window_days: 7
  structuring_min_count: 4
  round_trip_min_days: 3
  round_trip_max_days: 14
  round_trip_amount_tol: "0.05"       # 5% amount tolerance
  spike_z: 2.5
  spike_z_high: 3.5
  concentration_high: "0.80"          # top-3 customer revenue share
  concentration_medium: "0.60"
  round_amount_threshold: 0.30
  round_amount_high_threshold: 0.60
  founder_monthly_limit: "500000"     # ₹5 lakh/month with no declared salary
  founder_salary_multiple: "3"
  severity_weights:                   # compute_composite_score
    HIGH: 10.0
    MEDIUM: 5.0
    LOW: 2.0

health:                               # analysis/financial_health_alerts.py
  runway_critical_months: "2"
  runway_low_months: "4"
  runway_healthy_months: "6"
  burn_extreme_ratio: 3.0
  burn_high_ratio: 1.5
  nrr_severe_pct: 0.70
  nrr_contraction_pct: 0.85
  nrr_par_pct: 1.00
  churn_high_pct: 0.30
  churn_elevated_pct: 0.15
  sustained_decline_months: 3         # consecutive MoM declines → HIGH
  stagnation_band: "0.02"             # |MoM growth| below this for 3 months → flat
  burn_acceleration_min_growth: 0.20  # 3-month burn growth
  burn_acceleration_margin: 0.15      # ... and exceeding revenue growth by this

customer_analytics:                   # analysis/customer_analytics.py
  churn_silence_months: 3
  min_months_for_regularity: 6
  regularity_gap_multiple: 2.0
  aggregator_dominance_threshold: 0.30

reconciliation:                       # analysis/reconciliation.py
  severity_high_delta_pct: 30         # |delta| % → HIGH
  severity_medium_delta_pct: 15       # |delta| % → MEDIUM
  revenue_tolerance_pct: 8
  customer_count_tolerance_pct: 12
  salary_headcount_tolerance_pct: 18
  nrr_percent_input_cutoff: 5         # declared NRR above this is treated as a percentage
  nrr_tolerance: 0.08                 # absolute ratio delta
  nrr_high_delta: 0.20

portfolio:                            # analysis/portfolio_narrative.py
  high_risk_score: 50.0

india_compliance:                     # jurisdictions/india/rules.py
  cash_receipt_limit_269st: "200000"
  cash_loan_limit_269ss_t: "20000"
  gst_annual_turnover_gate: "4000000"
  gst_monthly_revenue_floor: "300000"
  tds_annual_salary_gate: "500000"
  ctr_cash_window_threshold: "1000000"
  rpt_concentration_threshold: 0.20

identity:                             # pipeline/customer_identity.py
  embedding_threshold: 0.85

related_party:                        # pipeline/related_party.py
  llm_confidence_threshold: 0.8
  llm_batch_size: 30

categoriser:                          # analysis/categoriser.py
  llm_batch_size: 50
  # Phase 4 v3 routing: rule -> ML >= tau_accept -> LLM(top-3) -> review.
  # Written by `python -m ml.categoriser.evaluate ... --write-thresholds` from
  # the company-split VALIDATION curve (docs/ml/categoriser.md). If the model
  # is not in models/categoriser/, the categoriser falls back to v2 rules.
  model_version: "cat3-svc_cal-company-8a28bbe2-191ad9"
  tau_accept: 0.90
  tau_review: 0.50
  # From `python -m ml.categoriser.rule_audit data/corpus/v1` (company train+val,
  # precision >= 0.99, support >= 50, not template-concentrated). Excluded:
  # 2,6 (0 support), 3 personal_suffix (generator-fitted), 7 self_transfer
  # (precision 0.0), 11-13 generic fallbacks. See docs/ml/categoriser.md.
  high_precision_rules: [0, 1, 4, 5, 8, 9, 10]

anomaly:                              # ml/anomaly (Phase 5), stage ml_anomaly in pipeline/run.py
  # Chosen on company-split VALIDATION companies by `python -m ml.anomaly.train`
  # and written by `python -m ml.anomaly.evaluate ... --write-thresholds`
  # (docs/ml/anomaly.md). If model_version is "unset" or the artifact is not in
  # models/anomaly/, the stage is skipped and no ML flags are produced.
  model_version: "anom1-pooled-company-8a28bbe2-a77238"
  contamination: 0.005                # flagged fraction per account (score percentile)
  min_history: 150                    # rows; shorter accounts are scored by the pooled model
  severity_high_pct: 0.9990           # score-percentile cutoffs
  severity_medium_pct: 0.9986
  max_flags_per_statement: 20         # analyst review budget

churn:                                # ml/churn (Phase 6), CustomerAnalyticsAnalyst.churn_risk
  # Chosen on TRAIN companies (5-fold GroupKFold out-of-fold predictions) by
  # `python -m ml.churn.train` and written by `python -m ml.churn.evaluate ...
  # --write-thresholds` (docs/ml/churn.md). If model_version is "unset" or the
  # artifact is not in models/churn/, churn_risk is absent and nothing else changes.
  model_version: "churn1-hgb_l15-8a28bbe2-2023be"
  decision_threshold: 0.275           # calibrated probability -> band "high"
  band_medium: 0.1749                 # calibrated probability -> band "medium"
  min_history_payments: 2             # payments; fewer -> rule fallback
  active_window_days: 90              # active = paid within 90 days of the last transaction
  rule_silence_days: 60               # rule fallback: silent longer -> "elevated" (not tuned)

segmentation:                         # ml/segmentation (Phase 6), Network Lens segments
  # Written by `python -m ml.segmentation.evaluate ... --write-thresholds`
  # (docs/ml/segmentation.md). "unset" or missing artifact -> no segments.
  model_version: "seg1-kmeans-k3-8a28bbe2-4ff229"
  n_peers: 3                          # nearest cohort peers per company
  stable_jaccard: 0.75                # Hennig: >= 0.75 stable; only stable clusters are named
