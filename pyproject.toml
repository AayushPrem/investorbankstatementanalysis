[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsaa"
version = "0.1.0"
description = "Agentic Bank Statement Analysis Platform — Indian market"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "anthropic>=0.28",
    "streamlit>=1.35",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "plotly>=5.20",
]
# Dependency audit (Phase 1, D9). Each decision is recorded in docs/CHANGELOG_UPGRADE.md.
# Removed (no import anywhere): pymupdf, tabula-py, weasyprint, jinja2,
# sqlalchemy, psycopg2-binary, networkx.
# Phase 2 re-adds sqlalchemy + psycopg2-binary under the [platform] extra,
# now that db/ imports them (docs/adr/0001-postgres-data-platform.md).

[project.optional-dependencies]
# Scanned-PDF / image OCR adapters (also needs the tesseract binary on PATH).
ocr = [
    "pytesseract>=0.3",
]
# MiniLM customer-identity embeddings (CustomerIdentityResolver(embedding_enabled=True)).
embeddings = [
    "sentence-transformers>=3.0",
]
# Data platform: Postgres system of record, job worker, FastAPI (Phase 2, ADR-0001/0002).
# The analysis pipeline and the Streamlit demo don't need it.
platform = [
    "sqlalchemy>=2.1",  # Select[T1, T2] typing (api/routers/runs.py)
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-openpyxl>=3.1",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["schema*", "adapters*", "pipeline*", "analysis*", "jurisdictions*", "reports*", "profiles*", "tools*", "demo*", "scripts*", "config*", "llm*", "db*", "api*", "worker*"]

[tool.setuptools.package-data]
config = ["thresholds.yaml"]
db = ["migrations/script.py.mako"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# demo/ entry points insert the project root into sys.path before importing
# project packages (needed for `streamlit run demo/app.py`), so E402 is intended.
"demo/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "demo/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "postgres: needs a real Postgres (BSAA_TEST_DATABASE_URL); skipped when unset",
]
filterwarnings = [
    # pipeline.orchestrator.Orchestrator is deprecated (Phase 1) but kept, with
    # its tests, until Phase 7. tests/test_run.py asserts that the warning fires.
    "ignore:pipeline.orchestrator.Orchestrator is deprecated:DeprecationWarning",
]
