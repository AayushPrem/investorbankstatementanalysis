name: CI

on:
  push:
    branches: [main, "sprint-*", "upgrade/*"]
  pull_request:
    branches: [main, "sprint-*", "upgrade/*"]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the `postgres`-marked tests (tests/platform/test_pg_queue.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bsaa
          POSTGRES_PASSWORD: bsaa
          POSTGRES_DB: bsaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsaa -d bsaa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BSAA_TEST_DATABASE_URL: postgresql+psycopg2://bsaa:bsaa@localhost:5432/bsaa_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          # No restore-keys: a pyproject.toml change must build a fresh venv,
          # otherwise packages removed from the dependency list would linger in
          # the cached venv and mask a missing dependency.
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,ocr,embeddings,platform,ml]"

      - name: Lint
        run: .venv/bin/python -m ruff check .

      # Gated scope: must be clean. Widen as packages are fixed (see
      # docs/CHANGELOG_UPGRADE.md for the remaining scope).
      - name: Type check (gated)
        run: .venv/bin/python -m mypy --follow-imports=silent schema/ pipeline/ config/ llm/ db/ api/ worker/ datasets/ ml/

      # Informational only — visible in logs, does not fail the build.
      - name: Type check (full scope, informational)
        continue-on-error: true
        run: .venv/bin/python -m mypy schema/ pipeline/ config/ llm/ db/ api/ worker/ datasets/ ml/ analysis/ adapters/ reports/ tools/ jurisdictions/

      - name: Build synthetic gold set
        run: .venv/bin/python -m scripts.build_gold_set

      # Phase 3: small synthetic corpus + split files (exercises the builder end to end).
      - name: Build small corpus and splits
        run: |
          .venv/bin/python -m datasets.build_corpus --small --seed 42
          .venv/bin/python -m datasets.splits data/corpus/v1-small --seed 42

      # Phase 4: train a small categoriser on v1-small so the suite and the gold
      # regression run the v3 hybrid path (the full-corpus model isn't committed).
      - name: Train CI categoriser model (v1-small)
        run: |
          .venv/bin/python -m ml.categoriser.train data/corpus/v1-small --profile ci --allow-unpinned | tee train_ci.txt
          grep '^CATEGORISER_MODEL_VERSION=' train_ci.txt >> "$GITHUB_ENV"

      # Phase 5: train a small anomaly model on v1-small (categories from the CI
      # categoriser above) so the suite and the regression run the ml_anomaly stage.
      - name: Train CI anomaly model (v1-small)
        run: |
          .venv/bin/python -m ml.anomaly.train data/corpus/v1-small --profile ci --allow-unpinned --n-jobs 2 | tee anomaly_ci.txt
          grep '^ANOMALY_MODEL_VERSION=' anomaly_ci.txt >> "$GITHUB_ENV"

      - name: Test
        run: .venv/bin/python -m pytest tests/ -q --ignore=tests/regression --tb=short

      # Fail loudly if the Postgres tests were skipped (they must run in CI).
      - name: Postgres tests (must not skip)
        run: .venv/bin/python -m pytest tests/platform/test_pg_queue.py -q -rs --tb=short -p no:cacheprovider | tee pg.txt && ! grep -q "skipped" pg.txt

      - name: Regression (synthetic gold set)
        run: .venv/bin/python -m pytest tests/regression/ -q -rxX -s --tb=short

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-regression
          path: results/sprint1/gold_regression.json
          if-no-files-found: warn
